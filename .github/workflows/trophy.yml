name: Generate Trophy Card

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "0 */12 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate GitHub Trophy
        uses: ryo-ma/github-profile-trophy@main
        with:
          username: ${{ github.repository_owner }}
          theme: dracula
          no-frame: true
          no-bg: true
          row: 1
          column: 6

      - name: Commit generated files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update GitHub trophies"
